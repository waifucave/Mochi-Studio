# Builds the unsigned desktop packages on Linux, Windows and macOS, as
# workflow artifacts, and runs the Spout2 and virtual camera tests. Started
# by hand (Actions → Desktop packages → Run workflow) or by a version tag,
# never by an ordinary push: macOS runners cost the most minutes.
#
# Run by hand, it publishes nothing, unless `release` is checked. A release
# starts in one of two ways, which share every step (scripts/release.mjs):
#
#   - by hand, on main, with `release` checked: the release is made with its
#     tag, v + package.json's version, at the commit the run is on;
#   - by a version tag pushed by hand: the release is made for that tag.
#
# The gate job checks first, before anything is built, that the release may
# be made (scripts/release.mjs gate); the release job makes it once every
# other job has passed, and checks the same again just before publishing.
# The tag the release job creates comes from the workflow's own token, which
# starts no other run: no second run from that tag.
#
# A rehearsal (by hand, `rehearsal` checked, in a private repository only)
# runs the same jobs and the same release calls with a throwaway tag,
# rehearsal-<run number>, then deletes that release and its tag and checks
# that nothing is left. It never touches v<version> or its release.
name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run every job, or only the Spout2 or the Linux camera test (a version tag runs them all)'
        type: choice
        options: [all, spout, vcam]
        default: all
      release:
        description: 'Make the release v<version> with its tag, at this commit (on main only; every job must pass)'
        type: boolean
        default: false
      rehearsal:
        description: 'Rehearse the release with a throwaway tag rehearsal-<run>, then remove it (private repositories only; not with release)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Whether this run makes a release, and if it does, that it may: on main (by hand) or at its
  # tag's commit (a tag), the version's tag and release not there yet (drafts included), the
  # changelog and the notes in place. Run by hand without `release`, it checks nothing.
  gate:
    runs-on: ubuntu-latest
    # Write: only to see draft releases (GitHub shows drafts to writers only). It writes nothing.
    permissions:
      contents: write
    outputs:
      release: ${{ steps.gate.outputs.release }}
      tag: ${{ steps.gate.outputs.tag }}
      version_tag: ${{ steps.gate.outputs.version_tag }}
      rehearsal: ${{ steps.gate.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          REHEARSAL: ${{ inputs.rehearsal }}
          ONLY: ${{ inputs.only }}
        run: node scripts/release.mjs gate

  package:
    needs: gate
    if: inputs.only != 'spout' && inputs.only != 'vcam'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            files: |
              desktop/dist/release/*.AppImage
              desktop/dist/release/HOW-TO-OPEN-linux.txt
          - os: windows-latest
            name: windows
            files: |
              desktop/dist/release/*.zip
              desktop/dist/release/HOW-TO-OPEN-windows.txt
          - os: macos-latest
            name: macos
            files: |
              desktop/dist/release/*.zip
              desktop/dist/release/HOW-TO-OPEN-macos.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # With install scripts: Electron's binary comes from its postinstall.
      - run: npm ci
      - name: Fetch the face and hand models (bundled with the pages)
        run: npm run fetch:models
      - run: npm run typecheck
      # Spout2 output: the sender addon, Windows only.
      - name: Fetch the Spout2 SDK and build the Spout2 addon
        if: matrix.name == 'windows'
        run: |
          npm run fetch:spout
          npm run build:spout
      # The virtual camera on Windows: the module and the camera DLLs.
      - name: Build the Windows virtual camera
        if: matrix.name == 'windows'
        run: npm run build:wincam
      # The virtual camera on macOS: the helper and the Camera Extension, unsigned.
      - name: Build the macOS virtual camera
        if: matrix.name == 'macos'
        run: npm run build:maccam
      # The virtual camera: its Linux module.
      - name: Build the virtual camera module
        if: matrix.name == 'linux'
        run: npm run build:v4l2
      - name: Build the packages (unsigned)
        shell: bash
        run: |
          set -o pipefail
          npm run desktop:package 2>&1 | tee package.log
          # The app's own icon (public/icon.svg) must be in every package, not Electron's.
          if grep -qi "default Electron icon is used" package.log; then
            echo "::error::electron-builder used Electron's default icon."
            exit 1
          fi
        env:
          # No signing, and no auto-discovery of signing identities.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Add the how-to-open note (what the unsigned-app warnings mean)
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          sed "s/<version>/$version/g" "desktop/how-to-open/${{ matrix.name }}.txt" \
            > "desktop/dist/release/HOW-TO-OPEN-${{ matrix.name }}.txt"
      # The version in the files' properties: the app and the camera DLLs (Windows), the
      # app and its Camera Extension (macOS). The packages' names carry it on every system.
      - name: The version in the files' properties
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $files = @(Get-Item 'desktop/dist/release/win-unpacked/Mochi Studio.exe') +
            @(Get-ChildItem -Recurse desktop/dist/release/win-unpacked -Filter 'mochi_camera_*.dll')
          foreach ($f in $files) {
            $p = $f.VersionInfo.ProductVersion
            "$($f.FullName.Substring((Get-Location).Path.Length + 1)): $p" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            if (-not $p -or -not $p.StartsWith($v)) { throw "$($f.Name) says version '$p', not $v." }
          }
          if ($files.Count -lt 4) { throw "Expected the app and three camera DLLs, found $($files.Count) files." }
      - name: The version in the files' properties
        if: matrix.name == 'macos'
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          app=$(ls -d desktop/dist/release/mac*/"Mochi Studio.app" | head -1)
          for plist in "$app/Contents/Info.plist" "$app"/Contents/Library/SystemExtensions/*.systemextension/Contents/Info.plist; do
            p=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
            echo "${plist#desktop/dist/release/}: $p" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$p" = "$v" ] || { echo "::error::$plist says version $p, not $v."; exit 1; }
          done
          echo "The app's minimum macOS: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Its architectures: $(lipo -archs "$app/Contents/MacOS/Mochi Studio")" | tee -a "$GITHUB_STEP_SUMMARY"
      # Each package started on its runner: its bridge answers with the version and serves the
      # pages, and its window connects (scripts/smoke-package.mjs). Linux: under a virtual
      # display, the AppImage extracted (the runner has no FUSE), with Chromium's sandbox on.
      - name: Start the packaged app
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke-package.mjs desktop/dist/release/*.AppImage --appimage-extract-and-run
      - name: Start the packaged app
        if: matrix.name == 'windows'
        run: node scripts/smoke-package.mjs "desktop/dist/release/win-unpacked/Mochi Studio.exe"
      - name: Start the packaged app
        if: matrix.name == 'macos'
        shell: bash
        run: |
          app=$(ls -d desktop/dist/release/mac*/"Mochi Studio.app" | head -1)
          node scripts/smoke-package.mjs "$app/Contents/MacOS/Mochi Studio"
      - name: The package's name and size
        shell: bash
        run: |
          cd desktop/dist/release
          for f in *.AppImage *.zip HOW-TO-OPEN-*.txt; do
            [ -f "$f" ] && echo "$f: $(wc -c < "$f") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mochi-studio-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  # Spout2 output: builds the addon and runs the Spout2 test, in
  # which a Spout2 receiver reads the app's senders back, and measures the
  # cost of both frame paths (test-results/spout-cost.json).
  spout:
    needs: gate
    if: inputs.only != 'vcam'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:spout
      - run: npm run build:spout
      - run: npm run desktop:build
      - name: Spout2 test
        run: npx vitest run --project browser test/browser/spout.test.ts
        env:
          MOCHI_SPOUT_TEST: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spout-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The virtual camera on Linux: loads v4l2loopback with the
  # camera's name, then runs the camera test with the fake device and with
  # the real one, which ffmpeg reads as a camera app would. When the module
  # can't load on the runner's kernel, the real-device test is skipped and
  # says why; the step below writes what happened to the job summary.
  vcam:
    needs: gate
    if: inputs.only != 'spout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # One package at a time: a name missing on this kernel (the runners'
      # Azure kernels have no linux-modules-extra) must not stop the rest.
      # DKMS builds the module against the running kernel's headers.
      # A run where apt hung for over ten minutes on the runner: bounded, so it fails instead.
      - name: Install v4l2loopback, ffmpeg and a virtual display
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          sudo apt-get install -y "linux-headers-$(uname -r)" || echo "No headers package for $(uname -r)."
          sudo apt-get install -y v4l2loopback-dkms || echo "v4l2loopback-dkms did not install."
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "No linux-modules-extra for $(uname -r) (not needed with DKMS)."
      - name: Load v4l2loopback as Mochi Studio Camera
        run: |
          # The runner's user is not in the video group: a udev rule opens the device to it, so
          # that udev, which sets the node's mode after the module loads (and may again later),
          # doesn't take a chmod back.
          echo 'KERNEL=="video10", SUBSYSTEM=="video4linux", MODE="0666"' | sudo tee /etc/udev/rules.d/99-mochi-vcam-test.rules
          sudo udevadm control --reload-rules
          if sudo modprobe v4l2loopback devices=1 video_nr=10 card_label="Mochi Studio Camera" exclusive_caps=1; then
            sudo udevadm settle --timeout=30 || true
            sudo chmod 666 /dev/video10
            ls -l /dev/video10
            if ! { test -r /dev/video10 && test -w /dev/video10; }; then
              echo "::error::/dev/video10 is not readable and writable by $(id -un)."
              exit 1
            fi
            echo "v4l2loopback loaded: $(cat /sys/class/video4linux/video10/name)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v4l2loopback did not load on kernel $(uname -r): the real-device test is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci
      - run: npm run build:v4l2
      - run: npm run build
      - run: npm run desktop:build
      - name: The native conversion against the reference
        run: npx vitest run --project unit src/core/virtualCamera.test.ts
      - name: The virtual camera, with the fake device and the real one
        run: |
          ls -l /dev/video10 2>/dev/null || true
          xvfb-run -a npx vitest run --project browser test/browser/vcam.test.ts
        env:
          MOCHI_DESKTOP_TEST: '1'
          MOCHI_VCAM_TEST: '1'

  # The release (when the gate said so), once every package and test job has passed. The only
  # job that writes to the repository. scripts/release.mjs stage checks that every package and
  # note is there; publish makes a draft with every file, checks each file's size and digest on
  # it, runs the gate again, and only then publishes it, which creates the tag at the run's
  # commit (a tag's run: the tag is there already). Whatever fails first, the draft is deleted:
  # no tag and no public release are left.
  release:
    if: needs.gate.outputs.release == 'true'
    needs: [gate, package, spout, vcam]
    runs-on: ubuntu-latest
    # One release at a time.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: mochi-studio-*
          path: artifacts
      - name: Every package and note is there
        run: >-
          node scripts/release.mjs stage "${{ needs.gate.outputs.version_tag }}" artifacts release
          release-notes.md "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          REHEARSAL: ${{ inputs.rehearsal }}
          ONLY: ${{ inputs.only }}
        run: node scripts/release.mjs publish release release-notes.md
      # (A rehearsal's release is gone by now: its log above says what it made and removed.)
      - name: The release
        if: needs.gate.outputs.rehearsal != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.gate.outputs.tag }}"
          gh release view "$tag" --json name,isPrerelease,isDraft,url,assets \
            --jq '"\(.name) (pre-release: \(.isPrerelease), draft: \(.isDraft))\n\(.url)\n" + ([.assets[] | "\(.name): \(.size) bytes, \(.digest // "no digest")"] | join("\n"))' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Tag $tag: $(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha) (this run: $GITHUB_SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
